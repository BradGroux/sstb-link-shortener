name = "sstb-link-shortener-production"
main = "src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "go.sstb.ai"
custom_domain = true


# D1 Database
# Note: database_id does NOT support environment variable substitution
# You must hardcode your actual database ID here (get it from: wrangler d1 list)
# This ID is not considered highly sensitive as it requires account access to use
[[d1_databases]]
binding = "DB"
database_name = "sstb-link-shortener-production"
database_id = "2463a037-750f-4ca5-bb46-74c93c8b8209"


# KV Namespace
# Note: id and preview_id do NOT support environment variable substitution
# You must hardcode your actual KV namespace IDs here (get them from: wrangler kv:namespace list)
[[kv_namespaces]]
binding = "CACHE"
id = "5cefbc3c54084baf87fad9fb66930e08"


# Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "sstb-link-shortener-production"


# Environment variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
CACHE_TTL = "604800"
MAX_LINKS_PER_DOMAIN = "10000"
CLOUDFLARE_ACCOUNT_ID = "323b20dd391cf458a421175f42155056"
ANALYTICS_DATASET_NAME = "sstb-link-shortener-production"

# Native, atomic Cloudflare rate-limit bindings. Namespace IDs are intentionally
# unique so each authentication surface has an independent counter.
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "731001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REGISTER_RATE_LIMITER"
namespace_id = "731002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "REFRESH_RATE_LIMITER"
namespace_id = "731003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_AUTH_RATE_LIMITER"
namespace_id = "731004"
simple = { limit = 60, period = 60 }


# Security & API Secrets:
# For one-click deploy: Values are prompted from .dev.vars.example
# For local development: Copy .dev.vars.example to .dev.vars and fill in values
# For production: Use "wrangler secret put SETUP_TOKEN" etc.
#
# Required secrets:
#   SETUP_TOKEN - Generated with: openssl rand -hex 32
#   ANALYTICS_IP_HASH_SECRET - Generated with: openssl rand -hex 32
#   CLOUDFLARE_API_TOKEN - API token with "Account Analytics Read" permission





# Cron triggers for scheduled tasks
# Daily tasks (midnight UTC): analytics aggregation and top 100 status check
# Status check every 6 hours: regular link status monitoring
[triggers]
crons = ["0 0 * * *", "0 */6 * * *"]

# Observability configuration
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

[placement]
mode = "smart"
